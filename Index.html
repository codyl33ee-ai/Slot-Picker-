<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<title>DEGEN SLOT PICKER 🎰</title><style>
body {
  margin: 0;
  background: radial-gradient(circle, #0a0014, #000);
  color: white;
  font-family: Impact, Arial;
  text-align: center;
  overflow: hidden;
}

h1 {
  font-size: 64px;
  color: gold;
  text-shadow: 0 0 40px purple, 0 0 60px gold;
  margin-top: 30px;
}

button {
  font-size: 32px;
  padding: 20px 60px;
  margin-top: 20px;
  background: linear-gradient(45deg, gold, orange);
  border: none;
  border-radius: 20px;
  cursor: pointer;
  box-shadow: 0 0 30px gold;
}
button:hover { transform: scale(1.1); }

#slotName {
  font-size: 48px;
  margin-top: 20px;
  text-shadow: 0 0 25px cyan;
}

#slotImg {
  width: 320px;
  margin-top: 20px;
  border-radius: 20px;
  box-shadow: 0 0 40px purple;
}

#multiplier {
  font-size: 64px;
  color: red;
  text-shadow: 0 0 30px red;
  margin-top: 15px;
}

#hype {
  font-size: 30px;
  margin-top: 10px;
  color: lime;
  text-shadow: 0 0 20px lime;
}

.flash {
  animation: flashBg 0.15s infinite;
}

@keyframes flashBg {
  0% { background-color: #000; }
  50% { background-color: #220033; }
  100% { background-color: #000; }
}
</style></head><body><h1>🎰 DEGEN SLOT PICKER 🎰</h1><button onclick="spin()">SPIN IT</button>

<div id="slotName">CLICK SPIN</div>
<img id="slotImg" src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Slot_machine.jpg/320px-Slot_machine.jpg" /><div id="multiplier"></div>
<div id="hype"></div><audio id="spinSound" src="https://www.myinstants.com/media/sounds/slot-machine.mp3"></audio>
<audio id="winSound" src="https://www.myinstants.com/media/sounds/casino-win.mp3"></audio>

<script>

// ===== BIGGER SLOT LIST =====
const slots = [
{ name:"Sweet Bonanza 1000", img:"https://images.hacksawgaming.com/slots/sweet-bonanza.jpg"},
{ name:"Gates of Olympus 1000", img:"https://images.hacksawgaming.com/slots/gates-of-olympus.jpg"},
{ name:"Sugar Rush 1000", img:"https://images.hacksawgaming.com/slots/sugar-rush.jpg"},
{ name:"Wanted Dead or a Wild", img:"https://images.hacksawgaming.com/slots/wanted.jpg"},
{ name:"Money Train 3", img:"https://images.hacksawgaming.com/slots/money-train-3.jpg"},
{ name:"Duck Hunters", img:"https://images.hacksawgaming.com/slots/duck-hunters.jpg"},

{ name:"The Dog House Megaways", img:"https://slotcatalog.com/userfiles/image/games/PragmaticPlay/The-Dog-House-Megaways.jpg"},
{ name:"Starlight Princess 1000", img:"https://slotcatalog.com/userfiles/image/games/PragmaticPlay/Starlight-Princess.jpg"},
{ name:"Chaos Crew 2", img:"https://slotcatalog.com/userfiles/image/games/Hacksaw/Chaos-Crew-2.jpg"},
{ name:"Le Bandit", img:"https://slotcatalog.com/userfiles/image/games/Hacksaw/Le-Bandit.jpg"},
{ name:"Hand of Anubis", img:"https://slotcatalog.com/userfiles/image/games/Hacksaw/Hand-of-Anubis.jpg"},
{ name:"Beam Boys", img:"https://slotcatalog.com/userfiles/image/games/Hacksaw/Beam-Boys.jpg"},

{ name:"Mental", img:"https://slotcatalog.com/userfiles/image/games/NolimitCity/Mental.jpg"},
{ name:"Deadwood", img:"https://slotcatalog.com/userfiles/image/games/NolimitCity/Deadwood.jpg"},
{ name:"Tombstone RIP", img:"https://slotcatalog.com/userfiles/image/games/NolimitCity/Tombstone-RIP.jpg"},
{ name:"San Quentin", img:"https://slotcatalog.com/userfiles/image/games/NolimitCity/San-Quentin.jpg"},

{ name:"Fruit Party 2", img:"https://slotcatalog.com/userfiles/image/games/PragmaticPlay/Fruit-Party-2.jpg"},
{ name:"Big Bass Bonanza", img:"https://slotcatalog.com/userfiles/image/games/PragmaticPlay/Big-Bass-Bonanza.jpg"},
{ name:"Madame Destiny Megaways", img:"https://slotcatalog.com/userfiles/image/games/PragmaticPlay/Madame-Destiny-Megaways.jpg"},

{ name:"Floating Dragon Megaways", img:"https://slotcatalog.com/userfiles/image/games/PragmaticPlay/Floating-Dragon-Megaways.jpg"},
{ name:"Buffalo King Megaways", img:"https://slotcatalog.com/userfiles/image/games/PragmaticPlay/Buffalo-King-Megaways.jpg"}
];

// ===== HYPE TEXT =====
const hypeTexts = [
"THIS ONE PRINTS 💰💰💰",
"1000x INCOMING 🔥",
"DO NOT SKIP THIS",
"CHAT SPAM W",
"THIS IS THE ONE",
"MAX WIN VIBES",
"FULL SCREEN INCOMING",
"BONUS FIRST SPIN??"
];

// ===== SPIN =====
function spin() {
  document.body.classList.add("flash");
  try { document.getElementById("spinSound").play(); } catch {}

  let interval = setInterval(() => {
    let r = slots[Math.floor(Math.random() * slots.length)];
    document.getElementById("slotName").innerText = r.name;
    document.getElementById("slotImg").src = r.img;
  }, 100);

  setTimeout(() => {
    clearInterval(interval);

    let final = slots[Math.floor(Math.random() * slots.length)];
    document.getElementById("slotName").innerText = final.name;
    document.getElementById("slotImg").src = final.img;

    rollMultiplier();
    showHype();

    try { document.getElementById("winSound").play(); } catch {}
    document.body.classList.remove("flash");
  }, 2500);
}

// ===== MULTIPLIER =====
function rollMultiplier() {
  let current = 0;
  let target = Math.floor(Math.random() * 500) + 1;

  let roll = setInterval(() => {
    current += Math.floor(Math.random() * 25);
    document.getElementById("multiplier").innerText = "x" + current;

    if (current >= target) {
      clearInterval(roll);
      document.getElementById("multiplier").innerText = "x" + target;
    }
  }, 50);
}

// ===== HYPE =====
function showHype() {
  let text = hypeTexts[Math.floor(Math.random() * hypeTexts.length)];
  document.getElementById("hype").innerText = text;
}

</script></body>
</html>
